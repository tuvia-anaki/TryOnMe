# Web process for `shopify app dev`: Vite dev server for the admin + a watcher
# that rebuilds the storefront scripts into the theme app extension.
name = "admin"
roles = ["frontend", "backend"]
# `shopify app dev` pings this on start; the dev server verifies and acknowledges it.
webhooks_path = "/webhooks/app/uninstalled"

[commands]
dev = "npm run dev:web"
