name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Build
        run: npm run build
        env:
          SHOPIFY_API_KEY: ci-placeholder
      - name: Storefront assets are committed and up to date
        run: git diff --exit-code -- extensions/variant-cards/assets
