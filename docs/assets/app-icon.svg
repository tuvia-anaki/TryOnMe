<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6f3ff"/>
      <stop offset="1" stop-color="#e7efff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#1b1f3b" flood-opacity="0.18"/>
    </filter>
  </defs>
  <rect width="1200" height="1200" fill="url(#bg)"/>
  <g transform="translate(28 50)">
  <!-- stacked variant photos -->
  <g filter="url(#shadow)">
    <rect x="250" y="250" width="520" height="600" rx="56" fill="#ff6b6b" transform="rotate(-12 510 550)"/>
    <rect x="340" y="220" width="520" height="600" rx="56" fill="#ffc53d" transform="rotate(4 600 520)"/>
    <rect x="420" y="250" width="520" height="600" rx="56" fill="#ffffff"/>
  </g>
  <!-- the selected variant's photo -->
  <rect x="470" y="300" width="420" height="420" rx="32" fill="#4c6fff"/>
  <circle cx="780" cy="400" r="46" fill="#ffffff" opacity="0.9"/>
  <path d="M470 660 L600 520 L700 610 L760 560 L890 700 L890 688 Q890 720 858 720 L502 720 Q470 720 470 688 Z" fill="#2b44c7"/>
  <!-- swatches -->
  <circle cx="545" cy="785" r="28" fill="#ff6b6b"/>
  <circle cx="625" cy="785" r="28" fill="#ffc53d"/>
  <circle cx="705" cy="785" r="28" fill="#4c6fff"/>
  <circle cx="705" cy="785" r="41" fill="none" stroke="#1b1f3b" stroke-width="9"/>
  <circle cx="785" cy="785" r="28" fill="#2ec27e"/>
  </g>
</svg>
