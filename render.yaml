# Render blueprint for Virtual Try-On.
# Create the services from this file: Render Dashboard → New → Blueprint.
#
# Secrets marked `sync: false` are NOT stored here — Render prompts for them
# (or you set them in the dashboard). Never commit real keys to git.

services:
  - type: web
    name: virtual-try-on
    runtime: node
    plan: starter # 512 MB — enough for a single instance
    region: frankfurt # pick the region closest to your merchants
    numInstances: 1 # rate limiting + retention sweep are per-instance state
    buildCommand: npm ci && npm run build
    # `setup` runs prisma generate + migrate deploy before the server starts.
    startCommand: npm run setup && npm run start
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22.18.0"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: virtual-try-on-db
          property: connectionString
      # --- Shopify (from your Partner app) ---
      - key: SHOPIFY_API_KEY
        sync: false
      - key: SHOPIFY_API_SECRET
        sync: false
      - key: SHOPIFY_APP_URL
        sync: false # e.g. https://virtual-try-on.onrender.com
      - key: SCOPES
        value: read_products,read_themes
      # --- Encryption of merchant API keys (openssl rand -base64 32) ---
      - key: ENCRYPTION_KEY
        sync: false
      # --- Object storage for shopper photos + results ---
      - key: STORAGE_DRIVER
        value: s3
      - key: S3_BUCKET
        sync: false
      - key: S3_REGION
        value: auto
      - key: S3_ENDPOINT
        sync: false # Cloudflare R2: https://<account-id>.r2.cloudflarestorage.com
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false

databases:
  - name: virtual-try-on-db
    plan: basic-256mb
    region: frankfurt # must match the web service region
    postgresMajorVersion: "16"
