# Prism Variant Images — Shopify app configuration.
#
# This is the same Shopify app that was "tryon" (same client id, same
# installs); deploying this config renames it and replaces the try-on code.
#
# The admin is hosted on the existing Render service (build + start commands
# in package.json; Render deploys on every push to main). See README.md.

client_id = "de2bb6df4fa93a082338e0276869c84f"
name = "Prism Variant Images"
application_url = "https://tryonme.onrender.com"
embedded = true

[build]
# One app serves both production and the dev store: don't let `shopify app dev`
# repoint the live app at a temporary tunnel.
automatically_update_urls_on_dev = false

[access_scopes]
# read/write_products: read variants + media, save variant image assignments
#   (product metafields) and set each variant's native image.
# read_themes: check that the app embed is turned on in the live theme.
scopes = "read_products,write_products,read_themes"

[access.admin]
# The admin UI calls the GraphQL Admin API straight from the browser through
# App Bridge ("Direct API access"): no backend, no tokens, no database.
direct_api_mode = "online"
embedded_app_direct_api_access = true

[auth]
redirect_urls = ["https://tryonme.onrender.com/auth/callback"]

[webhooks]
api_version = "2026-07"

  # Mandatory privacy webhooks. The app stores no customer data; the worker
  # verifies the HMAC and acknowledges (see src/worker/webhooks.ts).
  [[webhooks.subscriptions]]
  compliance_topics = ["customers/data_request", "customers/redact", "shop/redact"]
  uri = "/webhooks/compliance"

[pos]
embedded = false
